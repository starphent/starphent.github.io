<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    <style>

        html {
            height: 100%; /* THIS is required for % to work on body */
        }

        body {
            background-color: #000000;
            height: 99.2746vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-family: "Shantell Sans", cursive;
            font-size: 25px;
            color: white;
            text-align: center;
            margin-bottom: 4px;
        }

        .box {
            background-color: #2e0060;
            padding: 40px 10px;
            max-width: 800px;
            text-align: center;
            margin: 32px auto 40px;
            border: 4px solid rgba(0, 0, 0, 0.2);
        }

        .superbuttonbox {
            max-width: 700px;
            padding: 0 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 0;
            margin-right: auto;
            margin-left: auto;
            gap: 20px;
        }

        .linkbox {
            background-color: #d09500;
            min-width: 150px;
            min-height: 150px;
            width: 90%;
            text-align: center;
            border: 4px solid rgba(0, 0, 0, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            align-items: center;
            margin: 1px auto 20px;
            transition: all 0.3s ease;
        }

        .linkbox:hover {
            transform: scale(1.1);
        }



        .linkbox h2 {
            font-family: "Shantell Sans", cursive;
            font-size: 20px;
            margin-top: 10px;
            justify-content: flex-start;
            text-align: center;
            margin-bottom: 0;
            vertical-align: middle;
        }
        .linkbox img {
            font-size: 20px;
            margin-top: 10px;
            vertical-align: middle;
        }
        p {
            font-family: "Shantell Sans", cursive;
            font-size: 25px;
            color: white;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .backbutton:hover {
            transform: scale(1.1);
        }

        .backbutton {
            display: flex;
            background-color: #d09500;
            padding: 10px 1px;
            max-width: 100px;
            text-align: center;
            border: 4px solid rgba(0, 0, 0, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            align-items: center;
            margin: 1px auto 20px;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .backbutton h2 {
            font-family: "Shantell Sans", cursive;
            font-size: 25px;
            text-align: center;
            margin: auto;
            vertical-align: middle;
        }

        @media screen and (max-width: 1000px) {
            body {
                zoom: 1.2; /* Enlarges the element by 20% */
                /* Or use: transform: scale(1.2); transform-origin: top left; */
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<title>Reviews</title>
<body>
<div class="box">
    <h1>Reviews</h1>


    <div class="superbuttonbox"><!-- Line Start -->
        <a href="" class="linkbox-link" style="text-decoration: none; color: inherit;">
            <div class="linkbox">
                <img src="Reviews/MiceTea/Assets/Icon.png" height="90" width="90" style = "margin-left: auto;" /><br>
                <h2>Mice Tea</h2>

            </div>
        </a>

    </div><!-- Line End -->
    <a href="index.html" class="linkbox-link" style="text-decoration: none; color: inherit;">
        <div class="backbutton">
            <h2>Back</h2>
            <p></p>
        </div>
    </a>
</div>

</body>
</html>
