<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            padding-top: 100px;
        }

        h1 {
            font-family: "Shantell Sans", cursive;
            font-size: 25px;
            color: white;
            text-align: center;
            margin-bottom: 4px;
        }

        .box {
            background-color: #2e0060;
            padding: 40px 50px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            margin: 1px auto 0;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .prioritylinks {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 20px;
        }

        .prioritylinks a {
            transition: transform 0.3s ease;
        }

        .prioritylinks a:hover {
            transform: scale(1.1);
        }

        .linkbox {
            display: flex;
            background-color: #d09500;
            padding: 30px 1px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            margin: 1px auto 0;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            align-items: center;
            margin-bottom: 20px;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .linkbox:hover {
            transform: scale(1.05);
        }



        .linkbox h2 {
            font-family: "Shantell Sans", cursive;
            font-size: 25px;
            text-align: center;
            margin-bottom: 0;
            margin-top: 0;
            vertical-align: middle;
        }
        p {
            font-family: "Shantell Sans", cursive;
            font-size: 25px;
            color: white;
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
        }
        .linkbox img {
            margin-right: -60px;
            margin-left: 10px;
        }
        https://subscribestar.art/starphent
    </style>
</head>
<body>
<div class="box">
<div style="text-align: center;">
<img src="Starphent.png" height="150" width="150"/>
</div>
<h1>Starphent</h1>
<p>Jaroner</p>
    <div class="prioritylinks">
        <a href="https://www.youtube.com/@Starphent">
            <img src="youtube.png" height="50" width="50" />
        </a>
        <a href="https://www.twitch.tv/starphent">
            <img src="twitch.png" height="50" width="50" />
        </a>
    </div>

    <a href="https://www.youtube.com/@Starphent" class="linkbox-link" style="text-decoration: none; color: inherit;">
    <div class="linkbox">
        <img src="youtube.png" height="50" width="50"/>
        <h2>Youtube</h2>
        <p></p>
    </div>
        </a>

    <a href="https://www.twitch.tv/starphent" class="linkbox-link" style="text-decoration: none; color: inherit;">
        <div class="linkbox">
            <img src="twitch.png" height="50" width="50"/>
            <h2>Twitch</h2>
            <p></p>
        </div>
    </a>
</div>
</body>
</html>
