    <style>
        body {
            background-color: #000000;
            padding-top: 32px;

        h1 {
            font-family: "Shantell Sans", cursive;
            font-size: 25px;
            color: white;
            text-align: center;
            margin-bottom: 4px;
        }

        .box {
            background-color: #2e0060;
            padding: 40px 40px;
            border-radius: 20px;
            max-width: 700px;
            text-align: center;
            margin: auto;
            overflow-clip-margin-left: min(-100px);
            border: 4px solid rgba(0, 0, 0, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }


        .primarybuttons {
            display: flex;
            justify-content: center;
            margin-bottom: 0;
            gap: 20px;
        }

        .prioritylinks a {
            transition: transform 0.3s ease;
        }

        .prioritylinks a:hover {
            transform: scale(1.1);
        }

        .linkbox {
            background-color: #d09500;
            border-radius: 20px;
            min-width: 150px;
            min-height: 150px;
            width: 90%;
            text-align: center;
            border: 4px solid rgba(0, 0, 0, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            align-items: center;
            margin: 1px auto 20px;
            transition: all 0.3s ease;
        }

        .linkbox:hover {
            transform: scale(1.05);
        }



        .linkbox h2 {
            font-family: "Shantell Sans", cursive;
            font-size: 20px;
            margin-top: 10px;
            justify-content: flex-start;
            text-align: center;
            margin-bottom: 0;
            vertical-align: middle;
        }
        .linkbox img {
            font-size: 20px;
            margin-top: 10px;
            vertical-align: middle;
        }
        p {
            font-family: "Shantell Sans", cursive;
            font-size: 25px;
            color: white;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .element {
            position: absolute;
            bottom: 0;
            right: 0;
        }
        @media screen and (max-width: 1000px) {
            .box {
                zoom: 1.3; /* Enlarges the element by 20% */
                /* Or use: transform: scale(1.2); transform-origin: top left; */
            }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
